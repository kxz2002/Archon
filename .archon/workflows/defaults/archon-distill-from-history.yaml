name: archon-distill-from-history
description: |
  Use when: User wants to extract a reusable Archon workflow from a past CC session.
  Triggers: "distill from history", "extract workflow from cc session",
            "crystallize from conversation", "mine conversation history",
            "build workflow from past sessions", "history to workflow",
            "distill this workflow", "learn from cc history".
  Does: Loads CC JSONL session log -> extracts structured tool call trace and
        reasoning content -> analyzes generalizable workflow intent ->
        generates workflow YAML -> presents for human review and approval ->
        validates locally with retry loop -> saves to .archon/workflows/.
  NOT for: Creating workflows from scratch descriptions (use archon-workflow-builder).
           Non-CC conversation histories. Editing existing workflows.

  Optional: pass a session UUID or full JSONL path as $ARGUMENTS.
  If omitted, auto-detects the most recent CC session for the current project.

interactive: true
provider: claude

nodes:
  # ─────────────────────────────────────────────────────────────────────
  # Node 1: Load CC session data (follows the load-run-data pattern from issue #976).
  # Centralized structured extraction; all downstream nodes consume this output.
  # ─────────────────────────────────────────────────────────────────────
  - id: load-session-data
    bash: |
      set -e

      # ── 1. Discover JSONL path ─────────────────────────────────────
      PROJECT_KEY=$(echo "$PWD" | sed 's|^/||' | tr '/' '-')
      PROJECTS_DIR="$HOME/.claude/projects/-$PROJECT_KEY"
      ALLOWED_ROOT="$HOME/.claude/projects"

      if [ -n "$ARGUMENTS" ]; then
        if [ -f "$ARGUMENTS" ]; then
          # Resolve real path and enforce allowlist (block traversal/symlink escape)
          REAL_PATH=$(realpath -e "$ARGUMENTS" 2>/dev/null || echo "")
          case "$REAL_PATH" in
            "$ALLOWED_ROOT"/*)
              SESSION_PATH="$REAL_PATH"
              ;;
            *)
              echo '{"error": "path outside ~/.claude/projects/ is not allowed", "stats": {"complexity": "low"}, "user_goals": [], "tool_trace": [], "parallel_groups": []}'
              exit 0
              ;;
          esac
        elif [ -f "$PROJECTS_DIR/$ARGUMENTS.jsonl" ]; then
          SESSION_PATH="$PROJECTS_DIR/$ARGUMENTS.jsonl"
        else
          echo '{"error": "session not found", "stats": {"complexity": "low"}, "user_goals": [], "tool_trace": [], "parallel_groups": []}'
          exit 0
        fi
      else
        if [ ! -d "$PROJECTS_DIR" ]; then
          echo '{"error": "no cc sessions for this project", "stats": {"complexity": "low"}, "user_goals": [], "tool_trace": [], "parallel_groups": []}'
          exit 0
        fi
        SESSION_PATH=$(ls -t "$PROJECTS_DIR"/*.jsonl 2>/dev/null | head -1)
        if [ -z "$SESSION_PATH" ]; then
          echo '{"error": "no jsonl files found", "stats": {"complexity": "low"}, "user_goals": [], "tool_trace": [], "parallel_groups": []}'
          exit 0
        fi
      fi

      SESSION_UUID=$(basename "$SESSION_PATH" .jsonl)
      SUBAGENTS_DIR="$PROJECTS_DIR/$SESSION_UUID/subagents"

      # ── 2. Extract and structure JSONL via Python ──────────────────
      python3 - "$SESSION_PATH" "$SUBAGENTS_DIR" <<'PYEOF'
      import sys, json, os

      session_path = sys.argv[1]
      subagents_dir = sys.argv[2] if len(sys.argv) > 2 else ""
      session_uuid = os.path.basename(session_path).replace('.jsonl', '')

      # Includes 'last-prompt' as noise
      NOISE_TYPES = {'file-history-snapshot', 'permission-mode', 'attachment',
                     'system', 'last-prompt'}
      MAX_TOOL_CALLS = 80
      TARGET_TOOL_CALLS = 60
      TRUNC = {'bash_cmd': 300, 'prompt': 200, 'result': 200,
               'thinking': 300, 'user_text': 400}

      raw_records = []
      try:
          with open(session_path, encoding='utf-8', errors='strict') as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      raw_records.append(json.loads(line))
                  except json.JSONDecodeError:
                      pass
      except (OSError, UnicodeDecodeError) as e:
          print(json.dumps({
              'error': f'cannot read session file: {e}',
              'stats': {'complexity': 'low'},
              'user_goals': [], 'tool_trace': [], 'parallel_groups': []
          }, ensure_ascii=False))
          sys.exit(0)

      total_raw = len(raw_records)

      # Pass 1: collect valid messages
      valid = []
      for r in raw_records:
          if r.get('type') in NOISE_TYPES:
              continue
          if r.get('type') not in ('user', 'assistant'):
              continue
          if r.get('isSidechain', False):
              continue
          msg = r.get('message', {})
          content = msg.get('content', '')

          if r['type'] == 'assistant' and isinstance(content, list):
              tool_calls = [c for c in content if c.get('type') == 'tool_use']
              if not tool_calls:
                  text = next((c.get('text', '') for c in content if c.get('type') == 'text'), '')
                  if len(text.strip()) < 20:
                      continue
              valid.append(r)
          elif r['type'] == 'user':
              if isinstance(content, str):
                  if content.strip():
                      valid.append(r)
              elif isinstance(content, list):
                  has_result = any(c.get('type') == 'tool_result' for c in content)
                  has_text = any(c.get('type') == 'text' and c.get('text', '').strip() for c in content)
                  if has_result or has_text:
                      valid.append(r)

      # Pass 2: extract tool calls, parallel groups, thinking, tool_result (with precise correlation)
      all_tool_calls = []
      tool_id_to_index = {}   # Precise tool_result correlation
      parallel_groups = []
      user_goals = []
      tool_counts = {}
      seen_tool_types = set()

      def trunc(v, limit):
          if v is None:
              return ''
          if isinstance(v, str):
              s = v
          else:
              s = json.dumps(v, ensure_ascii=False)
          return s[:limit] + ('...' if len(s) > limit else '')

      seen_thinking_uuids = set()

      for r in valid:
          msg = r.get('message', {})
          content = msg.get('content', '')
          uuid = r.get('uuid', '')

          if r['type'] == 'assistant' and isinstance(content, list):
              # Extract thinking block (AI reasoning)
              thinking_text = ''
              for c in content:
                  if c.get('type') == 'thinking':
                      raw_think = c.get('thinking', '') or c.get('text', '')
                      if raw_think:
                          thinking_text = trunc(raw_think, TRUNC['thinking'])
                          break

              tc_list = [c for c in content if c.get('type') == 'tool_use']

              # Parallel group detection (kept for completeness; CC usually splits writes, so this is typically empty)
              agent_calls = [c for c in tc_list if c.get('name') == 'Agent']
              if len(agent_calls) >= 2:
                  parallel_groups.append({
                      'assistant_uuid': uuid,
                      'agents': [
                          {
                              'desc': trunc(c.get('input', {}).get('description',
                                        c.get('input', {}).get('prompt', '')), 100),
                              'subagent_type': c.get('input', {}).get('subagent_type', '')
                          }
                          for c in agent_calls
                      ]
                  })

              for c in tc_list:
                  name = c.get('name', '')
                  inp = c.get('input', {})
                  tool_id = c.get('id', '')
                  tool_counts[name] = tool_counts.get(name, 0) + 1
                  is_first_type = name not in seen_tool_types
                  seen_tool_types.add(name)

                  if name == 'Bash':
                      brief = trunc(inp.get('command', ''), TRUNC['bash_cmd'])
                  elif name in ('Agent', 'Skill'):
                      brief = trunc(inp.get('description', inp.get('prompt', '')), TRUNC['prompt'])
                  else:
                      first_val = next(iter(inp.values()), '') if inp else ''
                      brief = trunc(first_val, TRUNC['prompt'])

                  entry = {
                      'tool': name,
                      'input_brief': brief,
                      'subagent_type': inp.get('subagent_type', '') if name == 'Agent' else '',
                      '_is_first_type': is_first_type,
                  }
                  # Attach thinking to the first tool_call of the same assistant turn
                  if thinking_text and uuid not in seen_thinking_uuids:
                      entry['reasoning_brief'] = thinking_text
                      seen_thinking_uuids.add(uuid)
                  entry['_assistant_uuid'] = uuid

                  all_tool_calls.append(entry)
                  # Precise index for tool_result correlation
                  if tool_id:
                      tool_id_to_index[tool_id] = len(all_tool_calls) - 1

          elif r['type'] == 'user':
              if isinstance(content, str) and content.strip():
                  user_goals.append(content[:TRUNC['user_text']])
              elif isinstance(content, list):
                  for c in content:
                      if c.get('type') == 'tool_result':
                          tid = c.get('tool_use_id', '')
                          rc = c.get('content', [])
                          brief = ''
                          if isinstance(rc, list):
                              brief = next((x.get('text', '')[:TRUNC['result']]
                                            for x in rc if x.get('type') == 'text'), '')
                          elif isinstance(rc, str):
                              brief = rc[:TRUNC['result']]
                          # Precise correlation via tool_use_id (no more positional [-1] guess)
                          idx = tool_id_to_index.get(tid)
                          if idx is not None and brief:
                              all_tool_calls[idx]['result_brief'] = brief

      # Sampling: keep key portions for long sessions
      total_tc = len(all_tool_calls)
      if total_tc > MAX_TOOL_CALLS:
          p0 = [t for t in all_tool_calls if t.get('_is_first_type')]
          p0_ids = {id(t) for t in p0}
          rest = [t for t in all_tool_calls if id(t) not in p0_ids]
          head = rest[:20]
          tail = rest[-15:]
          middle = rest[20:len(rest)-15]
          denom = max(1, TARGET_TOOL_CALLS - len(p0) - 35)
          step = max(1, len(middle) // denom) if middle else 1
          sampled_middle = middle[::step] if middle else []
          kept_ids = {id(t) for t in p0 + head + sampled_middle + tail}
          all_tool_calls = [t for t in all_tool_calls if id(t) in kept_ids]

      # Hard cap at TARGET so the documented bound is real
      all_tool_calls = all_tool_calls[:TARGET_TOOL_CALLS]

      # Complexity classification
      unique_types = len(tool_counts)
      total_calls = sum(tool_counts.values())
      if unique_types < 3 or total_calls < 5:
          complexity = 'low'
      elif unique_types >= 5 or total_calls >= 20:
          complexity = 'high'
      else:
          complexity = 'medium'

      # Subagent meta
      subagent_meta = []
      if subagents_dir and os.path.isdir(subagents_dir):
          for fname in sorted(os.listdir(subagents_dir)):
              if fname.endswith('.meta.json'):
                  try:
                      with open(os.path.join(subagents_dir, fname), encoding='utf-8', errors='strict') as mf:
                          subagent_meta.append(json.load(mf))
                  except (json.JSONDecodeError, OSError) as e:
                      print(f"Warning: failed to read subagent meta {fname}: {e}", file=sys.stderr)

      # Strip internal markers and add sequence numbers
      tool_trace = []
      for i, t in enumerate(all_tool_calls):
          entry = {k: v for k, v in t.items() if not k.startswith('_')}
          entry['seq'] = i + 1
          tool_trace.append(entry)

      result = {
          'session_uuid': session_uuid,
          'session_path': session_path,
          'stats': {
              'total_raw_lines': total_raw,
              'kept_tool_calls': len(tool_trace),
              'dropped_records': total_raw - len(valid),
              'tool_counts': tool_counts,
              'unique_tool_types': unique_types,
              'parallel_groups_count': len(parallel_groups),
              'complexity': complexity,
          },
          'user_goals': user_goals[:10],
          'tool_trace': tool_trace,
          'parallel_groups': parallel_groups,
          'subagent_meta': subagent_meta,
      }
      print(json.dumps(result, ensure_ascii=False))
      PYEOF

  # ─────────────────────────────────────────────────────────────────────
  # Node 2: Extract a generalizable workflow intent from the execution trace.
  # ─────────────────────────────────────────────────────────────────────
  - id: analyze-intent
    prompt: |
      You are a workflow architect skilled at distilling reusable, generic process
      patterns from AI execution traces.

      ## Structured CC session data

      $load-session-data.output

      ## Optional user notes

      $ARGUMENTS

      ## Task

      Analyze the trace above and extract a **generalizable** workflow structure.

      ### Input data reference

      - `user_goals`: user requests in the session (the most important intent signal)
      - `tool_trace`: tool-call sequence with `input_brief`, `result_brief`, `reasoning_brief` (AI reasoning)
      - `parallel_groups`: parallel Agent calls (usually empty; non-empty implies a real parallel pattern)
      - `stats.complexity`: complexity rating
      - `stats.tool_counts`: tool-usage stats

      ### Core principles

      1. **Generalize, do not specialize**: the name describes a task TYPE, not a
         specific instance. Good: `repo-architecture-analysis`. Bad:
         `analyze-archon-repo`. Nodes must not hard-code specific repo names,
         usernames, or paths.

      2. **Tool-type mapping**:
         - Mostly Bash -> `bash:` node
         - Repeated AI reasoning -> `prompt:` node
         - Data-transformation pattern -> `script:` node
         - User decision point -> `approval:` node
         - Repeated iteration -> `loop:` node

      3. **Parallelism detection**: judge from the semantics of `tool_trace`
         (same-type tools called back-to-back, sub-tasks independent of each other)
         to decide whether to model parallel nodes (sharing a parent). **Do not
         rely solely on the `parallel_groups` field.**

      4. **Feasibility**: return `feasibility: false` when `stats.complexity == "low"`.
    model: sonnet
    allowed_tools: []
    output_format:
      type: object
      properties:
        workflow_name:
          type: string
          description: "kebab-case, <= 30 chars, describes the task type"
        description:
          type: string
          description: "follows the 'Use when / Triggers / Does / NOT for' format"
        trigger_phrases:
          type: string
          description: "5-8 trigger phrases, comma-separated"
        dag_structure:
          type: string
          description: "natural-language node list with id, type, purpose, depends_on"
        has_parallelism:
          type: boolean
        feasibility:
          type: boolean
        feasibility_reason:
          type: string
      required:
        - workflow_name
        - description
        - trigger_phrases
        - dag_structure
        - has_parallelism
        - feasibility
        - feasibility_reason
    depends_on: [load-session-data]

  # ─────────────────────────────────────────────────────────────────────
  # Node 3: Generate the workflow YAML and write it to $ARTIFACTS_DIR.
  # Skipped when analyze-intent decided the trace is not workflow-worthy.
  # ─────────────────────────────────────────────────────────────────────
  - id: generate-workflow
    prompt: |
      You are an Archon workflow author. Generate a complete, valid Archon workflow
      YAML from the intent below.

      ## Workflow intent

      - **Name**: $analyze-intent.output.workflow_name
      - **Description**: $analyze-intent.output.description
      - **Trigger phrases**: $analyze-intent.output.trigger_phrases
      - **DAG structure**: $analyze-intent.output.dag_structure
      - **Has a parallel layer**: $analyze-intent.output.has_parallelism

      ## Archon node-type reference (pick exactly one per node)

      ```yaml
      # prompt node (AI execution)
      - id: my-node
        prompt: |
          Instructions to the AI; you can reference upstream output via $other-node.output
        model: haiku          # optional
        allowed_tools: []     # optional
        output_format:        # optional, structured output
          type: object
          properties:
            field: { type: string }
          required: [field]

      # bash node (shell, no AI, stdout = $<id>.output)
      - id: my-bash
        bash: |
          set -e
          echo "result"

      # script node (Python, no AI, stdout = $<id>.output)
      # $ARGUMENTS and $nodeId.output are text-substituted into the body.
      # For safe handling of upstream JSON, write it to a temp file first.
      - id: my-script
        script: |
          import json, os, sys

          # $ARGUMENTS is text-substituted (use directly in the script body)
          args_text = "$ARGUMENTS"
          result = {"args": args_text, "artifacts_dir": os.environ.get("ARTIFACTS_DIR", "")}
          print(json.dumps(result))
        runtime: uv   # required: 'bun' or 'uv'

      # loop node
      - id: my-loop
        loop:
          prompt: |
            Per-iteration instructions...
          until: DONE_SIGNAL
          max_iterations: 5

      # approval node (human gate, hard block)
      - id: my-approval
        approval:
          message: "Please review and confirm."
      ```

      Common fields: `depends_on: [node-id]`, `when: "$node.output == 'value'"`

      ### Variable resolution (CRITICAL — syntax is node-type-dependent)

      Not every variable syntax works in every node type. Use ONLY the supported
      forms below. `{{ .Args.xxx }}` and `${{...}}` are NEVER valid in Archon.

      | Variable | prompt | bash | script | approval |
      |----------|--------|------|--------|----------|
      | `$ARGUMENTS` | text-substituted | env var `$ARGUMENTS` | text-substituted | NO |
      | `$nodeId.output` | text-substituted | shell-quoted substitution | raw text substitution | text-substituted |
      | `$nodeId.output.field` | text-substituted | shell-quoted substitution | raw text substitution | text-substituted |
      | `$ARTIFACTS_DIR` | text-substituted | text-substituted | text + env `$ARTIFACTS_DIR` | NO |

      **Key rules:**
      - Prompt/loop nodes: all variables are text-substituted. Use `$nodeId.output`
        and `$nodeId.output.field` freely.
      - Bash nodes: `$ARGUMENTS` is available as the env var `$ARGUMENTS` (not
        text-substituted). `$nodeId.output` and `$nodeId.output.field` ARE resolved
        with shell-safe quoting. For complex JSON manipulation, prefer a script node.
      - Script nodes: `$ARGUMENTS` and `$nodeId.output` are text-substituted into
        the script body. If the output may contain quotes, newlines, or special
        characters, write it to a temp file in `$ARTIFACTS_DIR` and read it back.
      - Approval nodes: `$nodeId.output` and `$nodeId.output.field` are resolved.
        `$ARGUMENTS` and `$ARTIFACTS_DIR` are NOT resolved in approval messages.
      - **Never use `{{ .Args.xxx }}`** — that is Go-template syntax, not
        supported by Archon.
      - **Never use `${VAR}` or `${nodeId.output}` with braces.** Archon's
        substitution regexes only match `$VAR` and `$nodeId.output` (without
        braces). `${}` is bash syntax — it will NOT be resolved by the engine
        and will appear as literal text to the AI.

      ## Generation rules

      1. The top-level `name:` field must exactly equal `$analyze-intent.output.workflow_name`
      2. Node ids are unique and kebab-cased
      3. Each node picks exactly one type (mutually exclusive)
      4. Bash nodes should use `set -e` at the top. When a command's non-zero exit
         code must be captured (e.g. `grep` that may not match), use this pattern:
         ```bash
         set +e
         command_that_may_fail
         EXIT_CODE=$?
         set -e
         ```
         Never use bare `command || true` — the exit code is lost.
      5. Do not hard-code specific repo names or paths; parameterize via `$ARGUMENTS`
      6. Do not add a `model:` field unless there is a real reason

      ## Output requirements

      Save the workflow as a valid YAML string at `$ARTIFACTS_DIR/distilled-workflow.yaml`.
      **Use the Write tool** to create the file — do not use Edit or Bash.

      The file content must be a complete workflow YAML (top-level `name:`,
      `description:`, `nodes:`). Do not wrap it in markdown code fences
      (no ```yaml ... ```).
    model: opus
    denied_tools: [Edit, Bash]
    when: "$analyze-intent.output.feasibility == 'true'"
    depends_on: [analyze-intent]

  # ─────────────────────────────────────────────────────────────────────
  # Node 4: Render the generated workflow in a human-readable form for review.
  # ─────────────────────────────────────────────────────────────────────
  - id: present-workflow
    prompt: |
      Read the generated workflow YAML and present it to the caller as readable
      natural language plus an ASCII DAG diagram.

      1. Read the file with Bash:
         ```bash
         cat "$ARTIFACTS_DIR/distilled-workflow.yaml"
         ```

      2. Output in the format below (do NOT dump raw YAML):

         ---
         **Workflow name**: <name>
         **Use when**: <the "Use when" part of description>
         **Triggers**: <the "Triggers" part of description>

         **Node count**: N nodes

         **DAG structure**:
         ```
         node-a ──────────────────→ node-c
         node-b ──────────────────↗
         node-c ──→ node-d ──→ node-e
         ```

         **Per-node breakdown**:
         | Node | Type | Purpose | Depends on |
         |------|------|---------|------------|
         | node-a | bash | <one-line purpose> | - |
         | node-b | prompt | <one-line purpose> | node-a |
         | ... | ... | ... | ... |

         **Parameterization**: the user passes <describe expected input> via $ARGUMENTS
         ---

      This output is shown directly to the reviewer as the basis for approval, so
      be clear and accurate.
    allowed_tools: [Bash]
    when: "$analyze-intent.output.feasibility == 'true'"
    depends_on: [generate-workflow]

  # ─────────────────────────────────────────────────────────────────────
  # Node 5: Human review gate (hard block; capture_response collects feedback).
  # ─────────────────────────────────────────────────────────────────────
  - id: review-approval
    approval:
      message: |
        Please review the generated workflow above.

        $present-workflow.output

        If you want changes, include concrete feedback when approving
        (e.g. "make node X run in parallel", "add an approval gate").
        After approval, the workflow will be validated and saved automatically.
      capture_response: true
    when: "$analyze-intent.output.feasibility == 'true'"
    depends_on: [present-workflow]

  # ─────────────────────────────────────────────────────────────────────
  # Node 6: AI quality review — runs AFTER user approval so reviewer
  # feedback is incorporated. Principle-driven, not a fixed checklist:
  # schema fidelity, reference consistency, bash safety, node type
  # suitability, Archon convention alignment, and completeness.
  # ─────────────────────────────────────────────────────────────────────
  - id: quality-review
    prompt: |
      You are an Archon workflow quality reviewer. Read the generated workflow
      YAML and audit it for correctness, safety, and convention alignment.

      ## Working copy

      `$ARTIFACTS_DIR/distilled-workflow.yaml`

      ## Reviewer feedback (if any)

      $review-approval.output

      ## Review principles

      Check the workflow against each principle below. For every issue found,
      fix it directly with the Write tool. If the file is already correct,
      do not modify it.

      ### 1. Schema fidelity
      Every field on every node must exist in the Archon DAG node spec:
      - Per-node kind keys (exactly one): `prompt`, `bash`, `script`, `loop`,
        `approval`, `command`, `cancel`.
      - Common fields (all nodes): `id` (required), `depends_on` (optional,
        array), `when` (optional, string), `trigger_rule` (optional).
      - Prompt-node fields: `prompt`, `model`, `allowed_tools`, `denied_tools`,
        `output_format` (sub-fields: `type`, `properties`, `required`,
        `additionalProperties`), `systemPrompt`, `effort`, `thinking`, `tools`.
      - Bash-node fields: `bash`, `timeout` (optional, integer ms).
      - Script-node fields: `script`, `runtime` (required, `bun` or `uv`),
        `deps` (optional, array of strings), `timeout` (optional, integer ms).
      - Loop-node fields: `prompt`, `until` (required), `max_iterations`
        (required), `fresh_context` (optional, boolean), `until_bash` (optional).
      - Approval-node fields: `message` (required), `capture_response` (optional,
        boolean), `on_reject` (optional). There is NO `options` and NO
        `output_format` field on approval nodes.
      If you see an unrecognized key at any level, remove it or replace it
      with the correct field name.

      ### 2. Reference consistency
      - Every `$xxx.output` or `$xxx.output.field` variable used in a prompt,
        bash block, or approval message must have the referenced node id listed
        in `depends_on` (directly or transitively via another listed node).
      - Every node id in a `depends_on` list must be a real node in this file.
      - If a downstream node accesses `$foo.output.bar`, the upstream node
        must produce structured output containing that field.

      ### 3. Bash safety
      - Bash blocks must NEVER interpolate raw `$xxx.output` into heredoc
        bodies, `python3 -c` strings, or `eval`. Use `script` nodes
        (`runtime: bun` or `runtime: uv`) for structured data manipulation.
      - When a `$xxx.output` reference appears inside a bash block, verify it
        is double-quoted so spaces, quotes, or special characters in the output
        do not break the shell script.
      - `python3 -c "...$VAR..."` where `$VAR` comes from user input or
        upstream output is always unsafe. Use `pip show`, a script node, or
        pass the value through the environment instead.
      - If `set -e` is active, check every command that could legitimately return
        non-zero (grep, curl, `gh pr view`, `pip show`, etc.). These MUST use:
        ```bash
        set +e
        command_that_may_fail
        EXIT_CODE=$?
        set -e
        ```
        Bare `command || true` is an anti-pattern — the exit code is lost and
        cannot be checked afterward.
      - If a grep/curl/gh/pip command appears without this guard and the node
        has `set -e`, flag it as a MUST-FIX.

      ### 4. Node type suitability
      - If a node needs AI reasoning (research, analysis, judgment) it must be
        a `prompt` or `loop` node, never `bash` or `script`.
      - If a node does purely deterministic file I/O or command execution, use
        `bash` or `script`.
      - `loop` nodes must declare `until:` and `max_iterations`.

      ### 5. Archon convention alignment
      - All node `id` values must be kebab-case.
      - Boolean values in `when:` conditions use single-quoted strings:
        `'true'` / `'false'`, never bare `true` / `false`.
      - Workflows must NOT manually create git worktrees (`git worktree add`).
        Archon provides isolation automatically via the `--branch` CLI flag.
      - Top-level YAML fields follow this order: `name`, `description`,
        `interactive`, `provider`, `model`, `nodes`.

      ### 6. Completeness
      - A `name:` field with a kebab-case name.
      - A `description:` block with Use when / Triggers / Does / NOT for sections.
      - At least one `nodes:` entry.
      - No dangling `when:` conditions referencing non-existent node ids.

      ### 7. Variable syntax correctness (MUST-FIX if violated)
      The following patterns are NEVER valid in Archon and must be replaced:
      - `{{ .Args.xxx }}` — Go-template syntax. Use `$ARGUMENTS`.
      - `${{...}}` — not a valid Archon variable syntax.
      - `${ARGUMENTS}` or `${nodeId.output}` with braces — Archon's regexes
        match `$ARGUMENTS` and `$nodeId.output` only (no braces). `${}` is
        bash syntax; the engine will NOT substitute it.
      - `os.environ["ARCHON_ARG_ARGUMENTS"]` or `os.environ["ARCHON_NODE_OUTPUT_*"]` —
        these env var names do not exist. `$ARGUMENTS` and `$nodeId.output` are
        text-substituted into script bodies.
      - Any variable reference (`$xxx.output`) where the node id is not listed
        in `depends_on` — the reference will resolve to empty string.
      Check EVERY variable reference in the file against the resolution table
      (in the generate-workflow prompt of this workflow) and fix any mismatch.

      ## After review

      At the end of your response, summarize each principle and whether you
      found and fixed any issues. If no issues were found, state that the file
      passed all seven principles.
    allowed_tools: [Read, Write, Edit, Bash]
    model: sonnet
    when: "$analyze-intent.output.feasibility == 'true'"
    depends_on: [review-approval]
  # ─────────────────────────────────────────────────────────────────────
  # Node 7: Local validation loop (write file -> CLI validate -> fix).
  # Reviewer feedback and quality fixes were already applied by nodes 5-6.
  # No HTTP dependency; archon server need not be running.
  # ─────────────────────────────────────────────────────────────────────
  - id: validate-and-fix
    loop:
      prompt: |
        Your task: install the workflow to `.archon/workflows/` and validate it.
        The working copy has already passed quality review — focus on making the
        CLI validator pass. You are done when validation passes.

        ## Working copy (for editing)

        `$ARTIFACTS_DIR/distilled-workflow.yaml`

        ## Steps

        1. **Extract the workflow name and write to the target location**:

           ```bash
           WORKFLOW_NAME=$(grep -E '^name:' "$ARTIFACTS_DIR/distilled-workflow.yaml" | head -1 | awk '{print $2}' | tr -d '"' | tr -d "'")
           # Sanitize: only allow [A-Za-z0-9_-] to prevent command/path injection
           WORKFLOW_NAME=$(echo "$WORKFLOW_NAME" | tr -cd 'a-zA-Z0-9_-')
           if [ -z "$WORKFLOW_NAME" ]; then
             echo "Error: workflow name is empty or contains only invalid characters"
             exit 1
           fi
           mkdir -p .archon/workflows
           cp "$ARTIFACTS_DIR/distilled-workflow.yaml" ".archon/workflows/$WORKFLOW_NAME.yaml"
           echo "Wrote: .archon/workflows/$WORKFLOW_NAME.yaml"
           ```

        2. **Validate locally via the CLI** (no archon server required):

           ```bash
           bun run cli validate workflows "$WORKFLOW_NAME" 2>&1
           VALIDATE_EXIT=$?
           echo "Validate exit code: $VALIDATE_EXIT"
           ```

        3. **Decide**:
           - Exit code 0 (validation passed) -> emit `VALIDATED` at the **end**
             of your reply; the loop terminates.
           - Non-zero exit code -> read the validation errors, use Edit/Write to
             update `$ARTIFACTS_DIR/distilled-workflow.yaml`, then **return to
             step 1** to re-write and re-validate.

        ## Common errors and fixes

        | Error keyword | How to fix |
        |--------------|-----------|
        | `Missing required field 'name'` | Ensure top-level `name: workflow-name` exists |
        | `Missing required field 'description'` | Add a `description: \|` block |
        | `Duplicate node id` | Append a numeric suffix to the duplicate id |
        | `depends_on references unknown node` | Fix the id typo |
        | `Cycle detected` | Remove the circular dependency |
        | `loop requires until` | Add an `until:` field to the loop node |
        | `script node requires runtime` | Add `runtime: bun` or `runtime: uv` |
        | `Node 'X': Unrecognized key` | Check field spelling against the node-type reference above |
        | `output_format requires required field` | Add `required: [field1, ...]` inside `output_format` |
      fresh_context: false
      until: VALIDATED
      max_iterations: 2
    when: "$analyze-intent.output.feasibility == 'true'"
    depends_on: [quality-review]
  # ─────────────────────────────────────────────────────────────────────
  # Node 8: Final report (the write itself already happened in validate-and-fix).
  # ─────────────────────────────────────────────────────────────────────
  - id: save-workflow
    bash: |
      set -e

      WORKFLOW_NAME=$(grep -E '^name:' "$ARTIFACTS_DIR/distilled-workflow.yaml" | head -1 | awk '{print $2}' | tr -d '"' | tr -d "'")
      # Sanitize: only allow [A-Za-z0-9_-] to prevent command/path injection
      WORKFLOW_NAME=$(echo "$WORKFLOW_NAME" | tr -cd 'a-zA-Z0-9_-')

      if [ -z "$WORKFLOW_NAME" ]; then
        echo "Error: workflow name is empty or contains only invalid characters"
        exit 1
      fi

      WORKFLOW_PATH=".archon/workflows/$WORKFLOW_NAME.yaml"

      if [ ! -f "$WORKFLOW_PATH" ]; then
        echo "Error: saved workflow not found at $WORKFLOW_PATH"
        exit 1
      fi

      echo "Workflow distilled successfully."
      echo ""
      echo "  Name:     $WORKFLOW_NAME"
      echo "  Location: $WORKFLOW_PATH"
      echo ""
      echo "  Run:      archon workflow run $WORKFLOW_NAME"
      echo "  Validate: bun run cli validate workflows $WORKFLOW_NAME"
    when: "$analyze-intent.output.feasibility == 'true'"
    depends_on: [validate-and-fix]
